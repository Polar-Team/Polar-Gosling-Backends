name: Other
description: Submit an issue that doesn't fit other categories
title: "[Other]: "
labels: ["other"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for submitting an issue!
        
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Please describe your issue, question, or concern
      placeholder: What would you like to report or discuss?
    validations:
      required: true
      
  - type: dropdown
    id: issue-type
    attributes:
      label: Issue Type
      description: What best describes this issue?
      options:
        - Question
        - Documentation
        - Configuration
        - Build/Deployment
        - Performance
        - Security
        - Other
    validations:
      required: true
      
  - type: dropdown
    id: affected-part
    attributes:
      label: Related Part of Application
      description: Which part of the application is this related to?
      multiple: true
      options:
        - API/Routers (webhooks, runners, eggs, internal, health)
        - Services (AWS, Git, OpenTofu, Serverless)
        - Database/Storage (YDB, DynamoDB, S3)
        - Celery Workers/Tasks
        - Authentication/IAM
        - Infrastructure/Deployment
        - Documentation
        - Build System
        - Testing
        - General
        - Other
    validations:
      required: true
      
  - type: dropdown
    id: backward-compatibility
    attributes:
      label: Backward Compatibility
      description: Does this issue involve backward compatibility considerations?
      options:
        - "No backward compatibility concerns"
        - "Yes - involves compatibility issues"
        - "Yes - requires compatibility review"
        - "Not applicable"
    validations:
      required: true
      
  - type: textarea
    id: steps-or-details
    attributes:
      label: Steps or Additional Details
      description: Provide any relevant steps, details, or context
      placeholder: Any additional information that would help understand this issue
      
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, logs, or links here
