name: Docker Release

on:
  push:
    tags:
      - "mg-v*"   # e.g. mg-v0.1.3
      - "uf-v*"   # e.g. uf-v0.1.0
  workflow_dispatch:
    inputs:
      service:
        description: "Service to build (mothergoose, uglyfox, both)"
        required: true
        default: "both"
        type: choice
        options:
          - mothergoose
          - uglyfox
          - both

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/polar-team

jobs:
  # ---------------------------------------------------------------------------
  # Determine which services to build
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine services to build
        id: set-matrix
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "$TAG" == mg-v* ]]; then
              echo 'matrix={"include":[{"service":"mothergoose","dockerfile":"Dockerfile.mg","image":"mothergoose","context_dir":"mothergoose","tag_prefix":"mg-v"}]}' >> "$GITHUB_OUTPUT"
            elif [[ "$TAG" == uf-v* ]]; then
              echo 'matrix={"include":[{"service":"uglyfox","dockerfile":"Dockerfile.uf","image":"uglyfox","context_dir":"uglyfox","tag_prefix":"uf-v"}]}' >> "$GITHUB_OUTPUT"
            fi
          else
            SERVICE="${{ inputs.service }}"
            if [[ "$SERVICE" == "mothergoose" ]]; then
              echo 'matrix={"include":[{"service":"mothergoose","dockerfile":"Dockerfile.mg","image":"mothergoose","context_dir":"mothergoose","tag_prefix":"mg-v"}]}' >> "$GITHUB_OUTPUT"
            elif [[ "$SERVICE" == "uglyfox" ]]; then
              echo 'matrix={"include":[{"service":"uglyfox","dockerfile":"Dockerfile.uf","image":"uglyfox","context_dir":"uglyfox","tag_prefix":"uf-v"}]}' >> "$GITHUB_OUTPUT"
            else
              echo 'matrix={"include":[{"service":"mothergoose","dockerfile":"Dockerfile.mg","image":"mothergoose","context_dir":"mothergoose","tag_prefix":"mg-v"},{"service":"uglyfox","dockerfile":"Dockerfile.uf","image":"uglyfox","context_dir":"uglyfox","tag_prefix":"uf-v"}]}' >> "$GITHUB_OUTPUT"
            fi
          fi

  # ---------------------------------------------------------------------------
  # Build & push multi-arch images
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build ${{ matrix.service }} (amd64 + arm64)
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -m1 '^version' ${{ matrix.context_dir }}/pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected ${{ matrix.service }} version: $VERSION"

      - name: Resolve image tag
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ matrix.image }}"

          # For tag-triggered builds, use the tag version
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TAG_VERSION="${TAG#${{ matrix.tag_prefix }}}"
            TAGS="${IMAGE}:${TAG_VERSION},${IMAGE}:latest"
          else
            # For manual dispatch, use pyproject.toml version
            TAGS="${IMAGE}:${{ steps.version.outputs.version }},${IMAGE}:latest"
          fi

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Image tags: $TAGS"

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          labels: |
            org.opencontainers.image.title=${{ matrix.service }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify manifest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ matrix.image }}"
          VERSION="${{ steps.version.outputs.version }}"
          echo "Inspecting ${IMAGE}:${VERSION}"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
