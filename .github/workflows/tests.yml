name: Tests

on: [pull_request]

jobs:
  test:
    name: Run MotherGoose Tests with Python ${{ matrix.env }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: ["ubuntu-latest"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Install tox
        run: cd mothergoose && uv tool install --python-preference only-managed --python ${{ matrix.env }} tox --with tox-uv --with tox-gh

      - name: Install Python
        run: cd mothergoose && uv python install --python-preference only-managed ${{ matrix.env }}

      - name: Run test suite
        run: make mg-tox-all
