name: Tests

on:
  pull_request:
  workflow_dispatch:

env:
  LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

jobs:
  test:
    name: Run ${{ matrix.app }} Tests with Python ${{ matrix.env }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        env: ["3.10", "3.11", "3.12", "3.13"]
        os: ["ubuntu-latest"]
        app: ["mothergoose", "uglyfox"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install tox for ${{ matrix.app }}
        run: cd ${{ matrix.app }} && uv tool install --python-preference only-managed --python ${{ matrix.env }} tox --with tox-uv --with tox-gh

      - name: Install Python for ${{ matrix.app }}
        run: cd ${{ matrix.app }} && uv python install --python-preference only-managed ${{ matrix.env }}

      - name: Sync ${{ matrix.app }}
        run: cd ${{ matrix.app }} && uv sync --all-groups

      - name: Run pytest suite for ${{ matrix.app }}
        run: |
          if [ "${{ matrix.app }}" ==  "mothergoose" ]; then
            shortage="mg"
          else
            shortage="uf"
          fi
          make ${shortage}-tox-base-${{ matrix.env }}

  style:
    name: Run ${{ matrix.app }} Lint,Type and Format Checks on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: test
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        app: ["mothergoose", "uglyfox"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install tox for ${{ matrix.app }}
        run: cd ${{ matrix.app }} && uv tool install --python-preference only-managed --python 3.13 tox --with tox-uv --with tox-gh

      - name: Install Python for ${{ matrix.app }}
        run: cd ${{ matrix.app }} && uv python install --python-preference only-managed 3.13

      - name: Sync ${{ matrix.app }}
        run: cd ${{ matrix.app }} && uv sync --all-groups

      - name: Run pytest suite for ${{ matrix.app }}
        run: |
          if [ "${{ matrix.app }}" ==  "mothergoose" ]; then
            shortage="mg"
          else
            shortage="uf"
          fi
          make ${shortage}-lint && make ${shortage}-type && make ${shortage}-format-check

  compose-tests:
    name: Compose Smoke Tests
    runs-on: ubuntu-latest
    needs: [test, style]
    timeout-minutes: 15
    env:
      COMPOSE_PROFILES: seed,with-triggers

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Render CI .env
        run: |
          MG_VERSION=$(grep -m1 '^version' mothergoose/pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          UF_VERSION=$(grep -m1 '^version' uglyfox/pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          cp compose/.env.example compose/.env
          sed -i 's/^YDB_IMAGE_TAG=.*/YDB_IMAGE_TAG=25.4.1/' compose/.env
          sed -i 's/^LOCALSTACK_IMAGE_TAG=.*/LOCALSTACK_IMAGE_TAG=3.8.1/' compose/.env
          sed -i 's/^LOCALSTACK_AUTH_TOKEN=.*/LOCALSTACK_AUTH_TOKEN=${{ secrets.LOCALSTACK_AUTH_TOKEN }}/' compose/.env
          sed -i 's/^INTERNAL_SYNC_TOKEN=.*/INTERNAL_SYNC_TOKEN=ci-smoke-test-token-12345678/' compose/.env
          sed -i "s/^MG_IMAGE_TAG=.*/MG_IMAGE_TAG=${MG_VERSION}/" compose/.env
          sed -i "s/^UF_IMAGE_TAG=.*/UF_IMAGE_TAG=${UF_VERSION}/" compose/.env

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull service images
        run: |
          MG_VERSION=$(grep -m1 '^version' mothergoose/pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          UF_VERSION=$(grep -m1 '^version' uglyfox/pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          docker pull ghcr.io/polar-team/mothergoose:${MG_VERSION}
          docker pull ghcr.io/polar-team/uglyfox:${UF_VERSION}

      - name: Build remaining compose images
        run: |
          docker compose -f compose/docker-compose.yml build nest-git
          docker compose -f compose/docker-compose.yml build seed
          docker compose -f compose/docker-compose.yml build trigger-emulator

      - name: Start all services
        run: make compose-up-all

      - name: Run smoke tests
        run: make compose-smoke

      - name: Run smoke trigger tests
        run: make compose-smoke-triggers

      - name: Dump seed logs on failure
        if: failure()
        run: docker logs pg-stack-seed 2>&1 || true

      - name: Dump service logs on failure
        if: failure()
        run: docker compose -f compose/docker-compose.yml logs --no-color > compose-logs.txt 2>&1

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt
          retention-days: 7

      - name: Tear down services
        if: always()
        run: make compose-down
