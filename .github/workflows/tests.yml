name: Tests

on:
  pull_request:
  workflow_dispatch:

env:
  LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

jobs:
  test:
    name: Run ${{ matrix.app }} Tests with Python ${{ matrix.env }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        env: ["3.10", "3.11", "3.12", "3.13"]
        os: ["ubuntu-latest"]
        app: ["mothergoose", "uglyfox"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install tox for ${{ matrix.app }}
        run: cd ${{ matrix.app }} && uv tool install --python-preference only-managed --python ${{ matrix.env }} tox --with tox-uv --with tox-gh

      - name: Install Python for ${{ matrix.app }}
        run: cd ${{ matrix.app }} && uv python install --python-preference only-managed ${{ matrix.env }}

      - name: Sync ${{ matrix.app }}
        run: cd ${{ matrix.app }} && uv sync --all-groups

      - name: Run pytest suite for ${{ matrix.app }}
        run: |
          if [ "${{ matrix.app }}" ==  "mothergoose" ]; then
            shortage="mg"
          else
            shortage="uf"
          fi
          make ${shortage}-tox-base-${{ matrix.env }}

  style:
    name: Run ${{ matrix.app }} Lint,Type and Format Checks on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: test
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        app: ["mothergoose", "uglyfox"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install tox for ${{ matrix.app }}
        run: cd ${{ matrix.app }} && uv tool install --python-preference only-managed --python 3.13 tox --with tox-uv --with tox-gh

      - name: Install Python for ${{ matrix.app }}
        run: cd ${{ matrix.app }} && uv python install --python-preference only-managed 3.13

      - name: Sync ${{ matrix.app }}
        run: cd ${{ matrix.app }} && uv sync --all-groups

      - name: Run pytest suite for ${{ matrix.app }}
        run: |
          if [ "${{ matrix.app }}" ==  "mothergoose" ]; then
            shortage="mg"
          else
            shortage="uf"
          fi
          make ${shortage}-lint && make ${shortage}-type && make ${shortage}-format-check

  compose-tests:
    name: Compose Smoke Tests
    runs-on: ubuntu-latest
    needs: [test, style]
    timeout-minutes: 15
    env:
      COMPOSE_PROFILES: seed,with-triggers

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Use the 'docker' driver so built images land directly in the local
          # daemon store and are immediately available as FROM bases for
          # downstream builds (seed Dockerfile).
          driver: docker

      - name: Build MotherGoose image from source
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mtg
          load: true
          tags: ghcr.io/polar-team/mothergoose:pr-${{ github.sha }}

      - name: Build UglyFox image from source
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.uf
          load: true
          tags: ghcr.io/polar-team/uglyfox:pr-${{ github.sha }}

      - name: Render CI .env
        run: |
          PR_TAG="pr-${{ github.sha }}"
          cp compose/.env.example compose/.env
          sed -i 's/^YDB_IMAGE_TAG=.*/YDB_IMAGE_TAG=25.4.1/' compose/.env
          sed -i 's/^LOCALSTACK_IMAGE_TAG=.*/LOCALSTACK_IMAGE_TAG=3.8.1/' compose/.env
          sed -i 's/^LOCALSTACK_AUTH_TOKEN=.*/LOCALSTACK_AUTH_TOKEN=${{ secrets.LOCALSTACK_AUTH_TOKEN }}/' compose/.env
          sed -i 's/^INTERNAL_SYNC_TOKEN=.*/INTERNAL_SYNC_TOKEN=ci-smoke-test-token-12345678/' compose/.env
          sed -i "s/^MG_IMAGE_TAG=.*/MG_IMAGE_TAG=${PR_TAG}/" compose/.env
          sed -i "s/^UF_IMAGE_TAG=.*/UF_IMAGE_TAG=${PR_TAG}/" compose/.env

      - name: Verify locally-built images are available
        run: |
          docker image inspect ghcr.io/polar-team/mothergoose:pr-${{ github.sha }} > /dev/null
          docker image inspect ghcr.io/polar-team/uglyfox:pr-${{ github.sha }} > /dev/null

      - name: Build remaining compose images
        run: |
          PR_TAG="pr-${{ github.sha }}"
          docker compose -f compose/docker-compose.yml build nest-git
          docker compose -f compose/docker-compose.yml build trigger-emulator
          # seed: its FROM references the locally-built mothergoose image.
          # Build directly (not via compose) so we can skip pulling the base.
          docker build \
            --build-arg "MG_IMAGE_TAG=${PR_TAG}" \
            -t "pg-stack/seed:${PR_TAG}" \
            -f compose/seed/Dockerfile \
            .

      - name: Start all services
        run: make compose-up-all

      - name: Run smoke tests
        run: make compose-smoke

      - name: Run smoke trigger tests
        run: make compose-smoke-triggers

      - name: Dump seed logs on failure
        if: failure()
        run: docker logs pg-stack-seed 2>&1 || true

      - name: Dump service logs on failure
        if: failure()
        run: docker compose -f compose/docker-compose.yml logs --no-color > compose-logs.txt 2>&1

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt
          retention-days: 7

      - name: Tear down services
        if: always()
        run: make compose-down
