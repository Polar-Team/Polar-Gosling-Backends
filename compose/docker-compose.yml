# Docker Compose definition for the Polar-Gosling Cloud_Stack.
#
# All resources introduced by this stack are prefixed `pg-stack-` so that the
# stack cannot collide with the existing `pytest` / testcontainers suite
# (Requirements 13.1, 13.2, 13.3).
#
# Services are appended by subsequent sub-tasks of the implementation plan.

name: pg-stack

networks:
  pg-stack-net:
    name: pg-stack-net
    driver: bridge

volumes:
  pg-stack-localstack-data:
    name: pg-stack-localstack-data
  pg-stack-celery-broker-data:
    name: pg-stack-celery-broker-data

services:
  # --- ydb -----------------------------------------------------------------
  # Local YDB database: runners, egg_configs, sync_history, deployment_plans,
  # audit_logs, tofu_versions, gosling_version tables.
  # Requirements: 1.2, 1.3, 2.1, 2.2, 2.3, 2.4, 13.1, 13.4.
  ydb:
    container_name: pg-stack-ydb
    image: ydbplatform/local-ydb:${YDB_IMAGE_TAG:?set YDB_IMAGE_TAG in .env}
    environment:
      YDB_USE_IN_MEMORY_PDISKS: "true"
    ports:
      - "127.0.0.1:2136:2136"   # gRPC endpoint
      - "127.0.0.1:8765:8765"   # YDB Embedded UI (console)
    networks:
      - pg-stack-net
    healthcheck:
      test:
        - CMD-SHELL
        - /ydb -e grpc://localhost:2136 -d /local discovery whoami || exit 1
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 12
  # --- localstack ---------------------------------------------------------
  # LocalStack emulation of AWS services: S3 (polar-gosling-artifacts bucket),
  # SQS (mothergoose / uglyfox queues), EventBridge (trigger rules), and
  # Secrets Manager (aws-sm:// URI resolution).
  # Requirements: 1.2, 3.1, 3.2, 3.3, 3.4, 13.4.
  localstack:
    container_name: pg-stack-localstack
    image: localstack/localstack:${LOCALSTACK_IMAGE_TAG:?set LOCALSTACK_IMAGE_TAG in .env}
    environment:
      SERVICES: "s3,sqs,events,secretsmanager"
      DEFAULT_REGION: "us-east-1"
      LS_LOG: "warn"
      PERSISTENCE: "0"
    ports:
      - "127.0.0.1:4566:4566"   # LocalStack edge port
    volumes:
      - pg-stack-localstack-data:/var/lib/localstack
    networks:
      - pg-stack-net
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:4566/_localstack/health
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 12
  # --- celery-broker ------------------------------------------------------
  # Redis serving as the Celery broker and result backend for MotherGoose
  # and UglyFox task dispatch. Internal-only (no published host ports).
  # The `/data` volume is preserved across `compose-down` so queued messages
  # survive container recreation.
  # Requirements: 1.2, 4.1, 4.2, 4.3, 13.1, 13.2, 13.4.
  celery-broker:
    container_name: pg-stack-celery-broker
    image: redis:${CELERY_BROKER_IMAGE_TAG:?set CELERY_BROKER_IMAGE_TAG in .env}
    volumes:
      - pg-stack-celery-broker-data:/data
    networks:
      - pg-stack-net
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 6
  # --- nest-git -----------------------------------------------------------
  # HTTP Git server that exposes a seeded bare `nest.git` repo on
  # `http://nest-git/nest.git` inside `pg-stack-net`. The sample Nest tree
  # under `compose/nest/` is baked into the image at build time.
  #
  # Build context deviation
  # -----------------------
  # Task 4.2 literally specifies `context: ./nest-git`, but the Dockerfile
  # does `COPY nest /srv/nest-src`, which only resolves when the build
  # context is the parent `compose/` directory. Dockerfile `COPY` cannot
  # traverse `..`, so we must point the context at the parent and reference
  # the Dockerfile by path. This deviation is pre-approved in the task
  # prompt; see `nest-git/Dockerfile` header for the full rationale.
  # Requirements: 1.2, 8.1, 8.3, 13.1, 13.4.
  nest-git:
    container_name: pg-stack-nest-git
    build:
      context: .
      dockerfile: ./nest-git/Dockerfile
    image: pg-stack/nest-git:${NEST_GIT_IMAGE_TAG:-0.1.0}
    networks:
      - pg-stack-net
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost/nest.git/info/refs?service=git-upload-pack
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 6
  # --- seed ---------------------------------------------------------------
  # One-shot Cloud_Stack initializer: creates the YDB schema, seeds
  # LocalStack (S3 buckets, SQS queues, Secrets Manager entries, binary
  # artifacts), upserts seed `egg_configs` rows, and — under the
  # `with-triggers` Compose profile — creates EventBridge rules.
  #
  # Build context deviation
  # -----------------------
  # Task 5.6 literally specifies `context: ./seed`, but the Dockerfile in
  # `seed/Dockerfile` (Task 5.2) `FROM pg-stack/mothergoose:${MG_IMAGE_TAG}`
  # and `COPY compose/seed/seed.py /app/seed.py` etc., which only resolve
  # when the build context is the backends repo root (`../`). Dockerfile
  # `COPY` cannot traverse `..`, so we point the context at the repo root
  # and reference the Dockerfile by path. This deviation is pre-approved in
  # the task prompt; see `seed/Dockerfile` header for the full rationale.
  #
  # `restart: no` and the absence of a host-published port reflect the
  # one-shot exit-code semantics (R9.1). The image inherits the MG runtime
  # so `ydb`, `boto3`, and the MotherGoose `app` package are available.
  # Requirements: 1.7, 9.1, 9.6, 13.1, 13.4.
  seed:
    container_name: pg-stack-seed
    build:
      context: ../
      dockerfile: compose/seed/Dockerfile
    image: pg-stack/seed:${MG_IMAGE_TAG:-dev}
    restart: "no"
    profiles:
      - seed
    depends_on:
      ydb:
        condition: service_healthy
      localstack:
        condition: service_healthy
      nest-git:
        condition: service_healthy
    environment:
      # MotherGoose YDB wiring — identical to mothergoose-api/-worker so the
      # seed connects to the same cluster the app containers will consume.
      MOTHERGOOSE_YDB_ENDPOINT: "grpc://ydb:2136"
      MOTHERGOOSE_YDB_DATABASE: "/local"
      # AWS / LocalStack wiring — every boto3 call from seed.py targets the
      # in-stack LocalStack edge port with the conventional dummy creds.
      AWS_ENDPOINT_URL: "http://localstack:4566"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
      # Seed-specific knobs.
      SEED_DATA_DIR: "/app/fixtures"
      # SEED_PROFILE mirrors COMPOSE_PROFILES so seed.py can detect whether
      # the `with-triggers` profile is active and decide whether to create
      # EventBridge rules (R9.3). COMPOSE_PROFILES is also forwarded so any
      # downstream code that reads it directly continues to work.
      SEED_PROFILE: "${COMPOSE_PROFILES:-}"
      COMPOSE_PROFILES: "${COMPOSE_PROFILES:-}"
    volumes:
      - ./seed/fixtures:/app/fixtures:ro
    networks:
      - pg-stack-net
