[project]
name = "pg-stack-compose"
version = "0.2.0"
description = "Docker Compose Cloud Stack Testing — property tests and scripts"
requires-python = ">=3.10"
dependencies = [
    "hypothesis>=6.100.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.50",
    "pycurl>=7.46.0",
    "ydb>=3.29.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["trigger", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
