[project]
name = "mothergoose"
version = "0.1.3"
description = "Backend server for Polar Gosling Orchestration of Nest tasks and Apex or Nadir handlers"
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [
      {name = "Daniel Dalavurak",email = "morsh110792@yahoo.com"}
]
dependencies = [
    "accessify>=0.3.1",
    "aioboto3>=15.0.0",
    "boto3>=1.35.0",
    "celery>=5.4.0",
    "fastapi>=0.115.12",
    "grpcio>=1.71.0",
    "grpcio-tools>=1.71.0",
    "jinja2>=3.1.6",
    "kombu>=5.4.0",
    "pydantic>=2.11.5",
    "redis>=5.2.0",
    "requests>=2.32.4",
    "tofupy>=1.1.1",
    "uvicorn>=0.34.0",
    "yandexcloud>=0.300.0",
    "ydb>=3.21.6",
]

[build-system]
requires = ["setuptools>=65.5.1"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
  "debugpy>=1.8.14",
  "tox-gh>=1.4.4",
  "tox>=4.23.2",
]
format = [
  "black>=23.9.24",
  "isort>=5.12.0",
]
style = [
  "pylint>=3.3.7",
  "flake8>=7.2.0",
  "flake8-pyproject>=1.2.3",
]
test = [
  "httpx>=0.28.1",
  "pytest>=8.3.5",
  "pytest-asyncio>=1.1.0",
  "pytest-dependency>=0.6.0",
  "testcontainers>=4.12.0",
  "requests-mock>=1.12.1",
  "hypothesis>=6.122.3",
]
type = [
  "mypy>=1.13.0",
  "types-requests>=2.32.0.20241016",
  "types-six>=1.17.0.20241205",
  "types-deprecated>=1.2.15.20241117",
  "celery-types>=0.24.0",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
    "integration",
]

[tool.tox]
env_list = [
    "3.10",
    "3.11",
    "3.12",
    "3.13",
    "format",
    "type",
    "style",
]
  skip_missing_interpreters = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.tox.env_run_base]
description = "Run tests under {base_python}"
dependency_groups = [
    "test",
]
commands = [["pytest"]]

[tool.tox.env.format]
description = "Format code with black and isort"
skip_install = true
dependency_groups = [
  "format",
]
commands = [
    ["black", "--check", "--diff", "src/app"],
    ["isort", "--check", "--diff", "src/app"],
]

[tool.tox.env.style]
description = "Check style with flake8 and pylint"
skip_install = true
dependency_groups = [
    "style",
]
commands = [
    ["pip", "install", "-e", "."],
    ["flake8", "src/app"],
    ["pylint", "src/app/*"],
]

[tool.tox.env.type]
description = "Check types with mypy"
skip_install = true
dependency_groups = [
    "type",
]
commands = [
    ["pip", "install", "-e", "."],
    ["mypy", "src/app"],
]

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E203", "W503"]

[tool.ruff.format]
line-ending = "auto"

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
disallow_untyped_defs = true
disallow_any_unimported = true
check_untyped_defs = true
no_implicit_reexport = true
warn_unreachable = true
warn_unused_configs = true
warn_redundant_casts = true
disable_error_code = [
    "import-untyped",
]

[[tool.mypy.overrides]]
module = [
    "app.util.*",
    "app.schema.*",
    "app.types.*",
]
ignore_missing_imports = true
disallow_any_unimported = false

[[tool.mypy.overrides]]
module = [
  "app.services.*",
  "app.db.ydb_connection",
  "app.db.dynamodb_connection",
]
disable_error_code = [
  "attr-defined",
]

[[tool.mypy.overrides]]
module = [
  "app.types.*"
]
disable_error_code = [
  "typeddict-unknown-key",
]

[[tool.mypy.overrides]]
module = [
  "celery",
  "celery.*",
  "kombu",
  "kombu.*",
]
ignore_missing_imports = true
disallow_any_unimported = false

